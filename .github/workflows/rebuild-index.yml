name: Verify published prompt registry

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'prompts/**'
      - 'README.md'
      - 'privacy.md'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: verify-prompt-registry
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run registry quality checks
        run: npm run quality

      - name: Ensure generated output is committed
        run: git diff --exit-code -- README.md data/prompts.csv data/prompts/index.jsonl prompts reports
