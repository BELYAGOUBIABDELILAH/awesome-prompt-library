name: Rebuild Prompt Index

on:
  push:
    branches:
      - main
    paths:
      - 'data/categories/**'
      - 'data/prompts.json'
      - 'scripts/generate-tree.js'
      - 'scripts/build-registry.js'
      - 'scripts/build-api.js'
      - 'api/index.html'
      - '.github/workflows/rebuild-index.yml'
  workflow_dispatch:

concurrency:
  group: rebuild-prompt-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate prompts tree
        run: node scripts/generate-tree.js

      - name: Build canonical registry
        run: node scripts/build-registry.js

      - name: Validate canonical registry
        run: node scripts/validate-registry.js

      - name: Build static JSON API
        run: node scripts/build-api.js

      - name: Commit and push generated changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Abdelilah"
          git config user.email "belyagoubiabdillahl@gmail.com"

          git add prompts/ README.md data/prompts.json data/prompts.csv data/registry.jsonl data/sources.json data/quarantine.jsonl data/registry-stats.json api/
          node scripts/check-staged.js

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "build: refresh prompt catalog"
            git push origin main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./api

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
